apply plugin: 'com.android.application'

ext {
    /* Version code for *next* release, bump *after* a release is created. */
    // 1 or more digits
    versionMajor = 7
    // exactly 1 digit
    versionMinor = 0
    // exactly 2 digits
    versionBuild = 02
}

android {
    namespace 'com.afwsamples.testdpc'
    compileSdkVersion 30
    buildToolsVersion "34.0.0"

    buildFeatures {
        buildConfig = true
        aidl = true
    }

    defaultConfig {
        applicationId "com.afwsamples.testdpc"
        minSdkVersion 21
        targetSdkVersion 30
        versionCode versionMajor * 1000 + versionMinor * 100 + versionBuild
        versionName "${versionMajor}.${versionMinor}.${versionBuild}"
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    flavorDimensions "packageName"
    productFlavors {
        normal {
            dimension 'packageName'
        }
        replica {
            dimension 'packageName'
            applicationIdSuffix ".replica"
        }
    }

    lintOptions {
        checkOnly 'NewApi'
        abortOnError false
        xmlReport false
        textReport true
        textOutput "stdout"
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    repositories {
        flatDir {
            dirs 'libs'
        }
        maven {
            url 'https://maven.google.com'
        }
    }
}

dependencies {
    def lifecycle_version = "2.0.0"
    implementation "androidx.lifecycle:lifecycle-extensions:$lifecycle_version"
    implementation 'androidx.enterprise:enterprise-feedback:1.0.0-alpha02'
    implementation 'androidx.multidex:multidex:2.0.0'
    implementation 'androidx.legacy:legacy-preference-v14:1.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.0.0'
    implementation 'androidx.legacy:legacy-support-v13:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
    implementation(name: 'setup-wizard-lib-platform-release', ext: 'aar')
    implementation 'org.bouncycastle:bcpkix-jdk15on:1.56'
    implementation 'org.bouncycastle:bcprov-jdk15on:1.56'
    implementation('com.google.guava:guava:23.6-android') {
        exclude group: 'org.checkerframework', module: 'checker-compat-qual'
        exclude group: 'org.checkerframework', module: 'checker-qual'
    }
    implementation('org.tensorflow:tensorflow-lite:2.14.0') {
        exclude group: 'org.checkerframework', module: 'checker-qual'
        exclude group: 'org.checkerframework', module: 'checker-compat-qual'
    }
    implementation('org.tensorflow:tensorflow-lite-api:2.14.0') {
        exclude group: 'org.checkerframework', module: 'checker-qual'
        exclude group: 'org.checkerframework', module: 'checker-compat-qual'
    }
    implementation('org.tensorflow:tensorflow-lite-gpu:2.14.0') {
        exclude group: 'org.checkerframework', module: 'checker-qual'
        exclude group: 'org.checkerframework', module: 'checker-compat-qual'
    }
    implementation('org.tensorflow:tensorflow-lite-support:0.4.4') {
        exclude group: 'org.checkerframework', module: 'checker-qual'
        exclude group: 'org.checkerframework', module: 'checker-compat-qual'
    }
    testImplementation 'org.robolectric:robolectric:4.2'
    testImplementation "com.google.truth:truth:0.44"
    testImplementation 'junit:junit:4.5'
    testImplementation 'androidx.test:core:1.0.0'
    annotationProcessor "androidx.lifecycle:lifecycle-compiler:$lifecycle_version"
}
